<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件服务器 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .success-message {
            background: #efe;
            color: #3c3;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .captcha-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .captcha-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .captcha-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .captcha-image {
            cursor: pointer;
            border: 2px solid #ddd;
            border-radius: 5px;
            transition: border-color 0.3s;
        }
        
        .captcha-image:hover {
            border-color: #667eea;
        }
        
        .captcha-hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>📁 文件服务器</h1>
        
        <div th:if="${param.error != null and param.error[0] == 'captcha_empty'}" class="error-message">
            请输入验证码
        </div>
        
        <div th:if="${param.error != null and param.error[0] == 'captcha_expired'}" class="error-message">
            验证码已过期，请刷新后重试
        </div>
        
        <div th:if="${param.error != null and param.error[0] == 'captcha_wrong'}" class="error-message">
            验证码错误，请重新输入
        </div>
        
        <div th:if="${param.error != null and param.error[0] != 'captcha_empty' and param.error[0] != 'captcha_expired' and param.error[0] != 'captcha_wrong'}" class="error-message">
            用户名或密码错误
        </div>
        
        <div th:if="${param.logout}" class="success-message">
            已成功退出登录
        </div>
        
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="captcha">验证码</label>
                <div class="captcha-container">
                    <input type="text" id="captcha" name="captcha" class="captcha-input" 
                           placeholder="请输入验证码" required maxlength="4" autocomplete="off">
                    <img src="/captcha" alt="验证码" class="captcha-image" 
                         onclick="this.src='/captcha?' + Math.random()" title="点击刷新验证码">
                </div>
                <div class="captcha-hint">点击图片可刷新验证码,不区分大小写</div>
            </div>
            
            <button type="submit">登录</button>
        </form>
    </div>
</body>
</html>
