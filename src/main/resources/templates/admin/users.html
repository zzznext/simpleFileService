<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - FileService</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
        }

        .back-link {
            color: #667eea;
            text-decoration: none;
            padding: 8px 16px;
            border: 2px solid #667eea;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: #667eea;
            color: white;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-warning {
            background: #ffc107;
            color: #333;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
            margin-right: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f9f9f9;
            color: #333;
            font-weight: 600;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-admin {
            background: #fff3cd;
            color: #856404;
        }

        .badge-user {
            background: #d1ecf1;
            color: #0c5460;
        }

        .badge-enabled {
            background: #d4edda;
            color: #155724;
        }

        .badge-disabled {
            background: #f8d7da;
            color: #721c24;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-footer {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 用户管理</h1>
            <div style="display: flex; gap: 10px;">
                <a href="/admin/dashboard" class="back-link">🎛️ 控制台</a>
                <a href="/admin/files" class="back-link">📁 文件管理</a>
                <a href="/files" class="back-link">返回文件列表</a>
                <button class="btn btn-primary" onclick="showCreateModal()">+ 创建用户</button>
            </div>
        </div>

        <!-- 显示成功/错误消息 -->
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- 用户列表 -->
        <div class="card">
            <div class="card-title">
                <span>用户列表</span>
                <span style="font-size: 14px; color: #999;">
                    共 <span th:text="${users != null ? users.size() : 0}">0</span> 个用户
                </span>
            </div>

            <div th:if="${users != null and !users.isEmpty()}">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>邮箱</th>
                            <th>角色</th>
                            <th>状态</th>
                            <th>注册时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.username}">admin</td>
                            <td th:text="${user.email != null ? user.email : '-'}">-</td>
                            <td>
                                <span th:if="${user.role == 'ADMIN'}" class="badge badge-admin">管理员</span>
                                <span th:if="${user.role == 'USER'}" class="badge badge-user">普通用户</span>
                            </td>
                            <td>
                                <span th:if="${user.enabled}" class="badge badge-enabled">✓ 正常</span>
                                <span th:if="${!user.enabled}" class="badge badge-disabled">✗ 禁用</span>
                            </td>
                            <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm:ss')}">-</td>
                            <td>
                                <form th:action="@{'/admin/users/toggle-status/' + ${user.id}}" method="post" style="display: inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-warning"
                                            th:onclick="'return confirm(\'确定要' + (${user.enabled} ? '禁用' : '启用') + '该用户吗？\');'">
                                        <span th:if="${user.enabled}">禁用</span>
                                        <span th:if="${!user.enabled}">启用</span>
                                    </button>
                                </form>
                                
                                <form th:action="@{'/admin/users/reset-password/' + ${user.id}}" method="post" style="display: inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-primary"
                                            onclick="return confirm('确定要重置该用户的密码吗？新密码将显示在页面上。');">
                                        重置密码
                                    </button>
                                </form>
                                
                                <form th:action="@{'/admin/users/delete/' + ${user.id}}" method="post" style="display: inline;"
                                      th:if="${user.id != currentUserId}">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-danger"
                                            onclick="return confirm('确定要删除该用户吗？这将同时删除用户上传的所有文件！');">
                                        删除
                                    </button>
                                </form>
                                
                                <span th:if="${user.id == currentUserId}" 
                                      style="color: #999; font-size: 12px;">当前用户</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${users == null or users.isEmpty()}" class="empty-message">
                暂无用户数据
            </div>
        </div>
    </div>

    <!-- 创建用户模态框 -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">创建新用户</div>
            <form action="/admin/users/create" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                
                <div class="form-group">
                    <label for="username">用户名 *</label>
                    <input type="text" id="username" name="username" required 
                           placeholder="请输入用户名" minlength="3" maxlength="50">
                </div>
                
                <div class="form-group">
                    <label for="password">密码 *</label>
                    <input type="text" id="password" name="password" required 
                           placeholder="请输入密码" minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" 
                           placeholder="可选">
                </div>
                
                <div class="form-group">
                    <label for="role">角色 *</label>
                    <select id="role" name="role" required>
                        <option value="USER" selected>普通用户</option>
                        <option value="ADMIN">管理员</option>
                    </select>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeCreateModal()" 
                            style="background: #ccc; color: #333;">取消</button>
                    <button type="submit" class="btn btn-primary">创建</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function showCreateModal() {
            document.getElementById('createModal').classList.add('active');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('active');
        }

        // 点击模态框外部关闭
        document.getElementById('createModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeCreateModal();
            }
        });
    </script>
</body>
</html>
