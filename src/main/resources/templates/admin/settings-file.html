<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件类型配置 - 系统设置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: white; padding: 20px 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #333; font-size: 24px; }
        .back-link { color: #667eea; text-decoration: none; padding: 8px 16px; border: 2px solid #667eea; border-radius: 5px; transition: all 0.3s; }
        .back-link:hover { background: #667eea; color: white; }
        .alert { padding: 12px 16px; border-radius: 5px; margin-bottom: 20px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .tabs { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); margin-bottom: 20px; display: flex; gap: 10px; }
        .tab { padding: 10px 20px; border-radius: 5px; text-decoration: none; color: #666; transition: all 0.3s; }
        .tab:hover { background: #f0f0f0; }
        .tab.active { background: #667eea; color: white; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .form-group input[type="text"], .form-group textarea, .form-group select { width: 100%; padding: 10px 15px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 14px; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .form-group .help-text { margin-top: 5px; color: #999; font-size: 12px; }
        .btn { padding: 12px 24px; border: none; border-radius: 5px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #ccc; color: #333; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ 系统设置</h1>
            <div><a href="/admin/dashboard" class="back-link">🎛️ 控制台</a></div>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="tabs">
            <a href="/admin/settings/storage" class="tab">💾 存储配置</a>
            <a href="/admin/settings/file" class="tab" th:classappend="${activeTab == 'file'} ? 'active' : ''">📁 文件类型</a>
            <a href="/admin/settings/security" class="tab">🔒 安全策略</a>
            <a href="/admin/settings/system" class="tab">⚙️ 系统配置</a>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 20px;">📁 文件类型配置</h2>
            <form th:action="@{/admin/settings/file}" method="post">
                <div class="form-group">
                    <label for="file.allowed_extensions">允许的文件扩展名</label>
                    <textarea id="file.allowed_extensions" name="file.allowed_extensions" rows="3" th:text="${configs['file.allowed_extensions']}" required></textarea>
                    <div class="help-text">用逗号分隔，如：jpg,png,pdf,docx</div>
                </div>

                <div class="form-group">
                    <label for="file.validation_mode">文件验证模式</label>
                    <select id="file.validation_mode" name="file.validation_mode">
                        <option value="extension" th:selected="${configs['file.validation_mode'] == 'extension'}">扩展名检查</option>
                        <option value="mime" th:selected="${configs['file.validation_mode'] == 'mime'}">MIME 类型检查</option>
                        <option value="strict" th:selected="${configs['file.validation_mode'] == 'strict'}">严格模式（推荐）</option>
                    </select>
                    <div class="help-text">严格模式会同时检查扩展名和 MIME 类型</div>
                </div>

                <div class="form-group">
                    <label for="file.enable_mime_check">启用 MIME 类型检查</label>
                    <select id="file.enable_mime_check" name="file.enable_mime_check">
                        <option value="true" th:selected="${configs['file.enable_mime_check'] == 'true'}">是</option>
                        <option value="false" th:selected="${configs['file.enable_mime_check'] == 'false'}">否</option>
                    </select>
                </div>

                <div style="margin-top: 30px;">
                    <button type="submit" class="btn btn-primary">💾 保存配置</button>
                    <a href="/admin/settings/file" class="btn btn-secondary">🔄 重置</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
