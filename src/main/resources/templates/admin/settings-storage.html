<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>存储配置 - 系统设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
        }

        .back-link {
            color: #667eea;
            text-decoration: none;
            padding: 8px 16px;
            border: 2px solid #667eea;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: #667eea;
            color: white;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .tabs {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .tab {
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            color: #666;
            transition: all 0.3s;
        }

        .tab:hover {
            background: #f0f0f0;
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input[type="number"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group .help-text {
            margin-top: 5px;
            color: #999;
            font-size: 12px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #ccc;
            color: #333;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            background: #bbb;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>⚙️ 系统设置</h1>
            <div style="display: flex; gap: 10px;">
                <a href="/admin/dashboard" class="back-link">🎛️ 控制台</a>
            </div>
        </div>

        <!-- 消息提示 -->
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- 选项卡 -->
        <div class="tabs">
            <a href="/admin/settings/storage" class="tab" th:classappend="${activeTab == 'storage'} ? 'active' : ''">💾 存储配置</a>
            <a href="/admin/settings/file" class="tab" th:classappend="${activeTab == 'file'} ? 'active' : ''">📁 文件类型</a>
            <a href="/admin/settings/security" class="tab" th:classappend="${activeTab == 'security'} ? 'active' : ''">🔒 安全策略</a>
            <a href="/admin/settings/system" class="tab" th:classappend="${activeTab == 'system'} ? 'active' : ''">⚙️ 系统配置</a>
        </div>

        <!-- 表单内容 -->
        <div class="card">
            <h2 style="margin-bottom: 20px; color: #333;">💾 存储配置</h2>
            
            <form th:action="@{/admin/settings/storage}" method="post">
                <!-- 系统总存储容量 -->
                <div class="form-group">
                    <label for="storage.max_total_size_gb">系统总存储容量（GB）</label>
                    <input type="number" 
                           id="storage.max_total_size_gb" 
                           name="storage.max_total_size_gb" 
                           th:value="${configs['storage.max_total_size_gb']}" 
                           min="1" 
                           required>
                    <div class="help-text">整个系统允许使用的最大存储空间</div>
                </div>

                <!-- 单用户存储配额 -->
                <div class="form-group">
                    <label for="storage.user_quota_gb">单用户存储配额（GB）</label>
                    <input type="number" 
                           id="storage.user_quota_gb" 
                           name="storage.user_quota_gb" 
                           th:value="${configs['storage.user_quota_gb']}" 
                           min="1" 
                           required>
                    <div class="help-text">每个用户默认的最大存储空间</div>
                </div>

                <!-- 存储警告阈值 -->
                <div class="form-group">
                    <label for="storage.warning_threshold_percent">存储警告阈值（%）</label>
                    <input type="number" 
                           id="storage.warning_threshold_percent" 
                           name="storage.warning_threshold_percent" 
                           th:value="${configs['storage.warning_threshold_percent']}" 
                           min="1" 
                           max="100" 
                           required>
                    <div class="help-text">当存储使用率达到此百分比时发出警告</div>
                </div>

                <!-- 单个文件最大大小 -->
                <div class="form-group">
                    <label for="upload.max_file_size_mb">单个文件最大大小（MB）</label>
                    <input type="number" 
                           id="upload.max_file_size_mb" 
                           name="upload.max_file_size_mb" 
                           th:value="${configs['upload.max_file_size_mb']}" 
                           min="1" 
                           required>
                    <div class="help-text">限制单个文件的最大上传大小</div>
                </div>

                <!-- 每日上传配额 -->
                <div class="form-group">
                    <label for="upload.daily_quota">每日上传配额（个）</label>
                    <input type="number" 
                           id="upload.daily_quota" 
                           name="upload.daily_quota" 
                           th:value="${configs['upload.daily_quota']}" 
                           min="1" 
                           required>
                    <div class="help-text">每个用户每天最多可上传的文件数量</div>
                </div>

                <!-- 提交按钮 -->
                <div style="margin-top: 30px;">
                    <button type="submit" class="btn btn-primary">💾 保存配置</button>
                    <a href="/admin/settings/storage" class="btn btn-secondary">🔄 重置</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
