<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理 - FileService</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
        }

        .back-link {
            color: #667eea;
            text-decoration: none;
            padding: 8px 16px;
            border: 2px solid #667eea;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: #667eea;
            color: white;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #333;
            font-size: 28px;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f9f9f9;
            color: #333;
            font-weight: 600;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-admin {
            background: #fff3cd;
            color: #856404;
        }

        .badge-user {
            background: #d1ecf1;
            color: #0c5460;
        }

        .filter-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 5px;
        }

        .filter-section label {
            font-weight: 500;
            margin-right: 10px;
        }

        .filter-section select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        /* 文件类型图标样式 */
        .file-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            margin-right: 8px;
            vertical-align: middle;
            font-size: 20px;
        }
        
        .file-name-cell {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 文件管理（管理员）</h1>
            <div style="display: flex; gap: 10px;">
                <a href="/admin/users" class="back-link">👥 用户管理</a>
                <a href="/files" class="back-link">返回文件列表</a>
            </div>
        </div>

        <!-- 显示成功/错误消息 -->
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- 统计信息 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">总文件数</div>
                <div class="stat-value" th:text="${stats.totalFiles}">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总存储大小</div>
                <div class="stat-value" th:text="${stats.totalSizeFormatted}">0 B</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">用户数量</div>
                <div class="stat-value" th:text="${stats.totalUsers}">0</div>
            </div>
        </div>

        <!-- 文件列表 -->
        <div class="card">
            <div class="card-title">
                <span>所有文件</span>
                <span style="font-size: 14px; color: #999;">
                    共 <span th:text="${files != null ? files.size() : 0}">0</span> 个文件
                </span>
            </div>

            <!-- 筛选器 -->
            <div class="filter-section">
                <form method="get" action="/admin/files" style="display: flex; gap: 10px; align-items: center;">
                    <label for="usernameSearch">搜索用户：</label>
                    <input type="text" id="usernameSearch" name="usernameSearch" 
                           th:value="${usernameSearch}" 
                           placeholder="输入用户名进行模糊搜索"
                           style="padding: 8px 12px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 14px; min-width: 250px;">
                    <button type="submit" class="btn btn-primary">搜索</button>
                    <a href="/admin/files" class="btn" style="background: #ccc; color: #333;">清除</a>
                </form>
            </div>

            <div th:if="${files != null and !files.isEmpty()}">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>文件名</th>
                            <th>文件大小</th>
                            <th>所属用户</th>
                            <th>上传时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="file : ${files}">
                            <td th:text="${file.id}">1</td>
                            <td>
                                <div class="file-name-cell">
                                    <!-- 根据文件扩展名显示不同图标 -->
                                    <span class="file-icon" th:text="${#strings.endsWith(#strings.toLowerCase(file.originalFilename), '.jpg') or #strings.endsWith(#strings.toLowerCase(file.originalFilename), '.jpeg') ? '🖼️' : 
                                        (#strings.endsWith(#strings.toLowerCase(file.originalFilename), '.png') ? '🖼️' :
                                        (#strings.endsWith(#strings.toLowerCase(file.originalFilename), '.gif') ? '🖼️' :
                                        (#strings.endsWith(#strings.toLowerCase(file.originalFilename), '.webp') ? '🖼️' :
                                        (#strings.endsWith(#strings.toLowerCase(file.originalFilename), '.pdf') ? '📄' :
                                        (#strings.endsWith(#strings.toLowerCase(file.originalFilename), '.doc') or #strings.endsWith(#strings.toLowerCase(file.originalFilename), '.docx') ? '📝' :
                                        (#strings.endsWith(#strings.toLowerCase(file.originalFilename), '.txt') ? '📃' :
                                        (#strings.endsWith(#strings.toLowerCase(file.originalFilename), '.csv') ? '📊' :
                                        (#strings.endsWith(#strings.toLowerCase(file.originalFilename), '.zip') or #strings.endsWith(#strings.toLowerCase(file.originalFilename), '.rar') or #strings.endsWith(#strings.toLowerCase(file.originalFilename), '.7z') ? '📦' : '📁'))))))))}"/> 
                                    <span th:text="${file.originalFilename}">filename.zip</span>
                                </div>
                            </td>
                            <td th:text="${file.fileSize != null and file.fileSize > 0 ? (#numbers.formatDecimal(file.fileSize / 1024.0, 1, 2) + ' KB') : '0 KB'}">0 KB</td>
                            <td>
                                <!-- 显示用户名 -->
                                <span th:each="user : ${users}" 
                                      th:if="${user.id == file.userId}" 
                                      th:text="${user.username}">username</span>
                            </td>
                            <td th:text="${file.uploadedAt != null ? #temporals.format(file.uploadedAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                            <td>
                                <form th:action="@{'/admin/files/delete/' + ${file.id}}" method="post" style="display: inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-danger"
                                            onclick="return confirm('确定要删除这个文件吗？');">
                                        删除
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${files == null or files.isEmpty()}" class="empty-message">
                暂无文件数据
            </div>
            
            <!-- 分页控件 -->
            <div th:if="${totalPages > 1}" style="margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 10px;">
                <span style="color: #666;">共 <span th:text="${totalElements}">0</span> 个文件，第 <span th:text="${currentPage + 1}">1</span>/<span th:text="${totalPages}">1</span> 页</span>
                
                <!-- 上一页 -->
                <a th:if="${currentPage > 0}" 
                   th:href="@{/admin/files(page=${currentPage - 1}, size=${pageSize}, usernameSearch=${usernameSearch})}"
                   class="btn" style="background: #667eea; color: white;">上一页</a>
                <span th:unless="${currentPage > 0}" class="btn" style="background: #ccc; color: #666; cursor: not-allowed;">上一页</span>
                
                <!-- 页码 -->
                <div style="display: flex; gap: 5px;">
                    <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                        <a th:if="${i != currentPage}" 
                           th:href="@{/admin/files(page=${i}, size=${pageSize}, usernameSearch=${usernameSearch})}"
                           class="btn" style="background: white; color: #667eea; border: 2px solid #667eea;" 
                           th:text="${i + 1}">1</a>
                        <span th:unless="${i != currentPage}" 
                              class="btn" style="background: #667eea; color: white; border: 2px solid #667eea;" 
                              th:text="${i + 1}">1</span>
                    </th:block>
                </div>
                
                <!-- 下一页 -->
                <a th:if="${currentPage < totalPages - 1}" 
                   th:href="@{/admin/files(page=${currentPage + 1}, size=${pageSize}, usernameSearch=${usernameSearch})}"
                   class="btn" style="background: #667eea; color: white;">下一页</a>
                <span th:unless="${currentPage < totalPages - 1}" class="btn" style="background: #ccc; color: #666; cursor: not-allowed;">下一页</span>
            </div>
        </div>
    </div>
</body>
</html>
