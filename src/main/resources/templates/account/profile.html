<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息 - FileService</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
        }

        .back-link {
            color: #667eea;
            text-decoration: none;
            padding: 8px 16px;
            border: 2px solid #667eea;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: #667eea;
            color: white;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .info-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .info-label {
            width: 120px;
            color: #666;
            font-weight: 500;
        }

        .info-value {
            flex: 1;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .password-hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>个人信息</h1>
            <a href="/files" class="back-link">返回文件列表</a>
        </div>

        <!-- 显示成功/错误消息 -->
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- 用户基本信息 -->
        <div class="card">
            <h2 class="card-title">基本信息</h2>
            <div class="info-row">
                <div class="info-label">用户名：</div>
                <div class="info-value" th:text="${user.username}"></div>
            </div>
            <div class="info-row">
                <div class="info-label">邮箱：</div>
                <div class="info-value" th:text="${user.email != null ? user.email : '未设置'}"></div>
            </div>
            <div class="info-row">
                <div class="info-label">角色：</div>
                <div class="info-value">
                    <span th:if="${user.role == 'ADMIN'}" style="color: #f59e0b; font-weight: bold;">管理员</span>
                    <span th:if="${user.role == 'USER'}" style="color: #667eea;">普通用户</span>
                </div>
            </div>
            <div class="info-row">
                <div class="info-label">账号状态：</div>
                <div class="info-value">
                    <span th:if="${user.enabled}" style="color: #10b981;">✓ 正常</span>
                    <span th:if="${!user.enabled}" style="color: #ef4444;">✗ 禁用</span>
                </div>
            </div>
            <div class="info-row">
                <div class="info-label">注册时间：</div>
                <div class="info-value" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></div>
            </div>
        </div>

        <!-- 修改邮箱 -->
        <div class="card">
            <h2 class="card-title">修改邮箱</h2>
            <form action="/account/change-email" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group">
                    <label for="email">新邮箱地址</label>
                    <input type="email" id="email" name="email" 
                           th:value="${user.email != null ? user.email : ''}"
                           placeholder="example@domain.com" 
                           required>
                </div>
                <button type="submit" class="btn btn-primary">更新邮箱</button>
            </form>
        </div>

        <!-- 修改密码 -->
        <div class="card">
            <h2 class="card-title">修改密码</h2>
            <form action="/account/change-password" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group">
                    <label for="oldPassword">当前密码</label>
                    <input type="password" id="oldPassword" name="oldPassword" 
                           placeholder="请输入当前密码" 
                           required>
                </div>
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" name="newPassword" 
                           placeholder="请输入新密码" 
                           minlength="6"
                           required>
                    <div class="password-hint">密码长度至少6位，需包含字母和数字</div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认新密码</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" 
                           placeholder="请再次输入新密码" 
                           minlength="6"
                           required>
                </div>
                <button type="submit" class="btn btn-primary">修改密码</button>
            </form>
        </div>
    </div>
</body>
</html>
