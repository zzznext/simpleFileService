spring.application.name=fileService
server.port=8067

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fileservice?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=li336699
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Liquibase configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.drop-first=false

# File storage configuration
file.upload-dir=./uploads
file.max-storage-size=1073741824
file.max-file-size=10485760
file.download-url-prefix=http://localhost:8067/download/

# Allowed file types (MIME types)
file.allowed-types=image/jpeg,image/png,image/gif,image/webp,application/zip,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/csv

# Allowed file extensions
file.allowed-extensions=.jpg,.jpeg,.png,.gif,.webp,.zip,.pdf,.doc,.docx,.txt,.csv

# Multipart file upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Error handling configuration
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

# Logging configuration
logging.level.liquibase=debug
